name: Agent experiment offline checks
on:
  push:
    branches:
      - experiment/market-analysis-agent-v0
    paths:
      - 'agent/**'
      - 'tests/test_agent_framework.py'
      - '.github/workflows/agent-experiment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the entire project offline
        run: python -m unittest discover -s tests -v
      - name: Dry-run plan (no LLM key or network)
        run: python -m agent.main plan --date 2026-11-03
