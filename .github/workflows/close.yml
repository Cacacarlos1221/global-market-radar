name: A-share after-close verification
on:
  schedule:
    - cron: '30 7 * * 1-5' # 15:30 Asia/Shanghai, weekday
    - cron: '50 7 * * 1-5' # 15:50 bounded backup; idempotent
    - cron: '12 8 * * 1-5' # 16:12 independent data retry if GitHub skipped earlier schedules
  workflow_dispatch:
  push:
    paths:
      - 'data/close_analysis/**'
      - 'data/close_requests/**'
      - 'scripts/close_review.py'
      - 'scripts/close_render.py'
      - 'scripts/render.py'
      - 'config/sector_watchlist.json'
      - '.github/workflows/close.yml'
permissions:
  contents: write
concurrency:
  group: market-radar-close-writer
  cancel-in-progress: false
jobs:
  after_close:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect confirmed close only for schedule / dispatch / request
        shell: bash
        run: |
          DAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          REQUEST_PATH="data/close_requests/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          LOCAL_TIME=$(TZ=Asia/Shanghai date +%H%M)
          if [[ "$LOCAL_TIME" < "1530" ]]; then
            echo "::notice title=PRE_CLOSE_SKIPPED::北京时间未到15:30，不能采集收盘K线；此run不代表已采集"
            echo "⚠️ PRE_CLOSE_SKIPPED: 当日收盘行情尚未采集，不能将此run作为盘后交付成功凭据" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -f "$REQUEST_PATH" ]]; then
            echo "Collecting 15:30+ same-day close for $DAY"
            python -m scripts.close_review --collect-only --date "$DAY"
          fi
          python -m scripts.close_review --enrich-only --date "$DAY"
          python -m scripts.close_review --render-only
          FACT_PATH="data/close/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          ANALYSIS_PATH="data/close_analysis/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          if [[ -f "$FACT_PATH" && -f "$ANALYSIS_PATH" ]]; then
            python -m scripts.close_review --check --date "$DAY"
            echo "✅ Today's verified close snapshot and GMR research analysis exist; rendered release checked." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=CLOSE_NOT_PUBLISHED::当日收盘快照或GMR研究分析尚缺失，不能视为完整盘后发布"
            echo "⚠️ CLOSE_NOT_PUBLISHED: 缺失当日收盘快照或GMR分析；15:55 GMR研究总控、16:25独立补救任务需完成后续分析发布。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate tests
        run: python -m unittest discover -s tests -v
      - name: Commit fact and rendered HTML (do not touch morning index)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/close
          if [ -d data/close ]; then git add -A -- data/close; fi
          if [ -d data/close_revisions ]; then git add -A -- data/close_revisions; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh A-share after-close review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
