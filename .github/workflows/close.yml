name: A-share after-close verification
on:
  schedule:
    - cron: '30 7 * * 1-5' # 15:30 Asia/Shanghai, weekday
    - cron: '50 7 * * 1-5' # 15:50 bounded backup; idempotent
  workflow_dispatch:
  push:
    paths:
      - 'data/close_analysis/**'
      - 'data/close_requests/**'
      - 'scripts/close_review.py'
      - 'scripts/close_render.py'
      - 'scripts/render.py'
      - 'config/sector_watchlist.json'
      - '.github/workflows/close.yml'
permissions:
  contents: write
concurrency:
  group: market-radar-writer
  cancel-in-progress: false
jobs:
  after_close:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect confirmed close only for schedule / dispatch / request
        shell: bash
        run: |
          DAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          REQUEST_PATH="data/close_requests/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -f "$REQUEST_PATH" ]]; then
            python -m scripts.close_review --collect-only --date "$DAY"
          fi
          python -m scripts.close_review --render-only
          FACT_PATH="data/close/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          ANALYSIS_PATH="data/close_analysis/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          if [[ -f "$FACT_PATH" && -f "$ANALYSIS_PATH" ]]; then
            python -m scripts.close_review --check --date "$DAY"
          else
            echo "Awaiting today's verified close snapshot and GPT post-close analysis."
          fi
      - name: Validate tests
        run: python -m unittest discover -s tests -v
      - name: Commit fact and rendered HTML (do not touch morning index)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/close
          if [ -d data/close ]; then git add -A -- data/close; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh A-share after-close review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
