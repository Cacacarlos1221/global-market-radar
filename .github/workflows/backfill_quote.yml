name: Backfill one missing quote
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backfill_quote.py'
      - '.github/workflows/backfill_quote.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-radar-writer
  cancel-in-progress: false
jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture only USD/CNY and rebuild HTML
        run: python -m scripts.backfill_quote --asset USD_CNY
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Commit supplement and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/supplements data/history index.html reports
          if ! git diff --cached --quiet; then
            git commit -m "data: supplement missing USD/CNY quote"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
