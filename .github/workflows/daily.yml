name: Daily market data and HTML
on:
  schedule:
    - cron: '5 0 * * *'  # 08:05 Beijing: start facts ahead of GPT total controller
    - cron: '15 0 * * *' # 08:15 Beijing: original safety trigger
    - cron: '35 0 * * *' # 08:35 Beijing: bounded fallback, idempotent
    - cron: '5 1 * * *'  # 09:05 Beijing: last pre-open freeze/release guard
  workflow_dispatch:
  push:
    paths:
      - 'data/analysis/**'
      - 'data/requests/**'
      - 'data/supplements/**'
      - 'scripts/render.py'
      - 'scripts/sources.py'
      - 'scripts/curate_data.py'
      - 'config/instruments.json'
      - 'docs/REPORT_SPEC.md'
      - '.github/workflows/daily.yml'
permissions:
  contents: write
concurrency:
  group: market-radar-writer
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect, repair missing quotes, freeze, and publish verified analysis
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          REPORT_PATH="data/daily/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          ANALYSIS_PATH="data/analysis/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          # The forecast is immutable: freeze early if a timestamped pre-open analysis exists.
          if [ -f "$ANALYSIS_PATH" ]; then
            python -m scripts.close_review --freeze-only --date "$REPORT_DATE"
          fi
          if [ ! -f "$REPORT_PATH" ]; then
            echo "No today's snapshot: collect fact layer without incomplete HTML"
            python -m scripts.pipeline --collect-only --date "$REPORT_DATE"
          fi
          # Original daily snapshot remains sealed. Recover missing core quotes in
          # separate versioned supplements. Do not render until analysis exists.
          python -m scripts.backfill_missing --date "$REPORT_DATE"
          # Always archive complete corrected research facts, even without AI analysis.
          python -m scripts.curate_data
          if [ -f "$REPORT_PATH" ] && [ -f "$ANALYSIS_PATH" ]; then
            python -m scripts.pipeline --render-only
            python -m scripts.release_check --date "$REPORT_DATE"
            python -m scripts.morning_audit --date "$REPORT_DATE" --require-published
          else
            echo "PENDING: collecting or awaiting verified AI analysis; no partial HTML published."
          fi
      - name: Validate regression tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html reports data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh market radar artifacts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
