name: Daily market data and HTML
on:
  schedule:
    - cron: '15 0 * * *'
    - cron: '35 0 * * *' # Backup trigger, idempotent if today's snapshot already exists
  workflow_dispatch:
  push:
    paths:
      - 'data/analysis/**'
      - 'data/requests/**'
      - 'data/supplements/**'
      - 'scripts/render.py'
      - 'config/instruments.json'
      - 'docs/REPORT_SPEC.md'
      - '.github/workflows/daily.yml'
permissions:
  contents: write
concurrency:
  group: market-radar-writer
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect facts or build fully analyzed report
        run: |
          REPORT_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          REPORT_PATH="data/daily/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          ANALYSIS_PATH="data/analysis/$(TZ=Asia/Shanghai date +%Y/%m/%Y-%m-%d).json"
          if [ -f "$REPORT_PATH" ] && [ -f "$ANALYSIS_PATH" ]; then
            python -m scripts.pipeline --render-only
            python -m scripts.release_check --date "$REPORT_DATE"
          elif [ -f "$REPORT_PATH" ]; then
            echo "Facts collected; waiting for verified AI analysis before publishing today's HTML"
          else
            echo "Collecting fact snapshot only: no incomplete public HTML is generated"
            python -m scripts.pipeline --collect-only
            if [ -f "$ANALYSIS_PATH" ]; then
              python -m scripts.pipeline --render-only
              python -m scripts.release_check --date "$REPORT_DATE"
            fi
          fi
      - name: Validate regression tests
        run: python -m unittest discover -s tests -v
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html reports data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh market radar artifacts"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
