name: Experimental agent checks
on:
  push:
    branches:
      - experiment/market-analysis-agent-v0
    paths:
      - 'agent/**'
      - 'tests/test_agent_*.py'
      - '.github/workflows/agent-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  agent-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Read-only agent plan
        run: python -m agent.main plan --date 2026-11-03
      - name: Render offline candidate report from real sealed snapshot
        run: python -m agent.main flow --date 2026-11-03 --offline
      - name: Save isolated HTML preview and evidence queue
        uses: actions/upload-artifact@v4
        with:
          name: market-agent-offline-preview
          path: agent/output/2026-11-03/
          retention-days: 7
      - name: External GDELT network smoke without API key
        continue-on-error: true
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from agent.web_research import research_web
          result = research_web(datetime.now(timezone.utc), max_articles=3)
          print("Actual publisher pages retrieved:", len(result["articles"]))
          print("Discovery / fetch errors:", len(result["errors"]))
          for item in result["articles"]:
              print("PUBLIC ARTICLE:", item["publisher"], item["url"])
          for error in result["errors"][:5]:
              print("SOURCE ERROR:", error)
          PY
      - name: Public official-source network smoke (no API key)
        run: python -m agent.main research-official
      - name: Save fetched source candidates and errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-agent-official-research
          path: agent/output/research/
          retention-days: 7
